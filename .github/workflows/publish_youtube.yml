name: Publish YouTube Short

on:
  repository_dispatch:
    types: [publish_youtube]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct MP4 URL'
        required: true
      title:
        description: 'Short Title'
        required: false
        default: 'Bharati Nature Cure Health Tip #Shorts'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run YouTube Uploader
        env:
          PAYLOAD_VIDEO_URL: ${{ github.event.client_payload.video_url }}
          PAYLOAD_TITLE: ${{ github.event.client_payload.title }}
          PAYLOAD_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          PAYLOAD_BOT_TOKEN: ${{ github.event.client_payload.bot_token }}
          PAYLOAD_CLIENT_ID: ${{ github.event.client_payload.yt_client_id }}
          PAYLOAD_CLIENT_SECRET: ${{ github.event.client_payload.yt_client_secret }}
          PAYLOAD_REFRESH_TOKEN: ${{ github.event.client_payload.yt_refresh_token }}
          INPUT_VIDEO_URL: ${{ inputs.video_url }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          python .github/scripts/youtube_uploader.py
